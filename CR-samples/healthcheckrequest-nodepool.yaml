# HealthCheckRequest - node-pool-level health check requested by the AKS RP.
# Created when a node pool is upgraded; one request covers the whole pool.
apiVersion: health.aks.io/v1alpha1
kind: HealthCheckRequest
metadata:
  name: userpool-6e8ef28e
  annotations:
    # UUID linking this request to the upgrade operation (set by RP)
    kubernetes.azure.com/upgradeCorrelationID: "6e8ef28e-bb8a-42cb-aa0b-d05a05b1ba0a"
    # Target Kubernetes version for the upgrade (set by RP)
    kubernetes.azure.com/targetKubernetesVersion: "1.33.5"
spec:
  scope: NodePool
  targetRef:
    name: userpool
