---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: upgradegatepolicies.upgrade.aks.io
spec:
  group: upgrade.aks.io
  names:
    kind: UpgradeGatePolicy
    listKind: UpgradeGatePolicyList
    plural: upgradegatepolicies
    shortNames:
    - ugp
    singular: upgradegatepolicy
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          UpgradeGatePolicy is the Schema for the upgradegatepolicies API.


          Installed by a monitoring app, typically from its Helm chart, to register
          that it gates upgrades for a set of nodes. It is install-time configuration:
          created once and unchanged across upgrade operations.


          During an upgrade the RP matches each node against the installed policies. A
          node that matches no policy is not gated and receives no HealthCheckRequest;
          a node that matches waits for every matched provider, each bounded by its own
          NodeTimeout. HealthSignals from a provider with no policy are ignored.


          One object per provider. Written only by the monitoring app; the RP reads it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: UpgradeGatePolicySpec defines the desired state of an UpgradeGatePolicy.
            properties:
              provider:
                description: |-
                  Provider is the identity of the monitoring app this policy registers.
                  It must match the "health.aks.io/provider" label the app sets on every
                  HealthSignal it creates.


                  Constrained to the Kubernetes label value rules: at most 63 characters,
                  alphanumeric at each end, and only '-', '_' or '.' in between. '/' is not
                  permitted. Use reverse-DNS to avoid collisions between vendors, for
                  example "node-monitor.example.com".
                maxLength: 63
                minLength: 1
                pattern: ^[A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?$
                type: string
              rules:
                description: |-
                  Rules are the targets this provider gates. A provider gating two node
                  pools on different terms lists two rules.


                  When more than one rule matches a target, the most specific rule applies:
                  a NodePool rule overrides a Cluster rule for nodes in that pool.
                items:
                  description: |-
                    UpgradeGateRule declares that this policy's provider gates one target, and on
                    what terms.


                    After each node is upgraded the RP opens a window for this provider and watches
                    its HealthSignals at every scope. NodeMinReadyPeriod is the floor on that
                    window and NodeTimeout the ceiling.
                  properties:
                    nodeMinReadyPeriod:
                      description: |-
                        NodeMinReadyPeriod is the shortest the RP observes a node before moving on,
                        even once that node has reported healthy. It keeps the window open so this
                        provider's NodePool- and Cluster-scoped signals have time to notice damage
                        that is invisible at the node itself.
                        Expressed as a Kubernetes duration (e.g., "30s", "2m").
                        Must not exceed NodeTimeout. Omitted means no floor: the window closes on
                        the node verdict.


                        An unhealthy verdict at any scope still aborts immediately; the floor delays
                        success, never failure.


                        Analogous to minReadySeconds on Deployment and DaemonSet, which exists
                        because "the new object reported Ready" is not on its own evidence that the
                        rollout is safe to continue.
                      type: string
                    nodeTimeout:
                      description: |-
                        NodeTimeout is the longest the AKS Resource Provider waits for this
                        provider's verdict after each node is upgraded. The timer starts when the
                        node's health check begins, so it also bounds a provider that never creates
                        a HealthSignal at all.
                        Expressed as a Kubernetes duration (e.g., "30s", "5m").
                        Capped at 5 minutes; larger values are clamped. Omitted means the cap.


                        The window closes as soon as the node reports healthy, unless
                        NodeMinReadyPeriod holds it open.


                        Each provider's NodeTimeout is independent. A target that is gated by
                        several providers waits for each against its own deadline.
                      type: string
                    onFailure:
                      default: Abort
                      description: |-
                        OnFailure is the action the RP takes when this provider reports unhealthy
                        or fails to report before NodeTimeout.
                      enum:
                      - Abort
                      type: string
                    target:
                      description: Target selects the nodes this rule applies to.
                      properties:
                        name:
                          description: |-
                            Name is the node pool name this rule applies to.
                            Required when Scope is NodePool. Ignored when Scope is Cluster.
                          type: string
                        scope:
                          description: |-
                            Scope indicates whether this rule targets the whole cluster or a single
                            node pool.
                          enum:
                          - Cluster
                          - NodePool
                          type: string
                      required:
                      - scope
                      type: object
                      x-kubernetes-validations:
                      - message: name is required when scope is NodePool
                        rule: self.scope != 'NodePool' || (has(self.name) && size(self.name)
                          > 0)
                  required:
                  - target
                  type: object
                  x-kubernetes-validations:
                  - message: nodeMinReadyPeriod must not exceed nodeTimeout
                    rule: '!has(self.nodeMinReadyPeriod) || !has(self.nodeTimeout)
                      || duration(self.nodeMinReadyPeriod) <= duration(self.nodeTimeout)'
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
            required:
            - provider
            - rules
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
