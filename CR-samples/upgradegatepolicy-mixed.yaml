apiVersion: upgrade.aks.io/v1alpha1
kind: UpgradeGatePolicy
metadata:
  name: mixed-monitor
spec:
  provider: mixed-monitor.example.com
  rules:
    # Default for every node in the cluster.
    - target:
        scope: Cluster
      nodeTimeout: 2m
      onFailure: Abort
    # userpool is slower to settle, so it overrides the default above.
    - target:
        scope: NodePool
        name: userpool
      nodeTimeout: 5m
      onFailure: Abort
